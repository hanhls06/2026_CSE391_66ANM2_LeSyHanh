<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bộ lọc & tìm kiếm sinh viên</title>

<style>
body{
font-family: Arial;
margin:40px;
}

input,select,button{
padding:6px;
margin-right:5px;
}

table{
border-collapse: collapse;
width:650px;
margin-top:15px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
cursor:pointer;
}

.low-score{
background:yellow;
}

#stats{
margin-top:10px;
font-weight:bold;
}
</style>

</head>
<body>

<h2>Quản lý điểm sinh viên</h2>

<input id="name" placeholder="Họ tên">
<input id="score" type="number" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<br><br>

<input id="search" placeholder="Tìm kiếm tên...">

<select id="filter">
<option value="all">Tất cả</option>
<option>Giỏi</option>
<option>Khá</option>
<option>Trung bình</option>
<option>Yếu</option>
</select>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="sortScore">Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<div id="stats">
Tổng SV: 0 | Điểm TB: 0
</div>

<script>

let students=[]
let filteredStudents=[]

let sortAsc=true

function getRank(score){

if(score>=8.5) return "Giỏi"
if(score>=7) return "Khá"
if(score>=5) return "Trung bình"
return "Yếu"

}

function applyFilters(){

const keyword=document
.getElementById("search")
.value
.toLowerCase()

const filter=document
.getElementById("filter")
.value

filteredStudents=students.filter(sv=>{

const matchName=
sv.name.toLowerCase().includes(keyword)

const rank=getRank(sv.score)

const matchRank=
filter==="all" || rank===filter

return matchName && matchRank

})

filteredStudents.sort((a,b)=>{

return sortAsc ? a.score-b.score : b.score-a.score

})

renderTable()

}

function renderTable(){

const tbody=document.getElementById("tableBody")

tbody.innerHTML=""

if(filteredStudents.length===0){

tbody.innerHTML=
"<tr><td colspan='5'>Không có kết quả</td></tr>"

updateStats()
return
}

filteredStudents.forEach((sv,index)=>{

const tr=document.createElement("tr")

if(sv.score<5){
tr.classList.add("low-score")
}

const realIndex=students.indexOf(sv)

tr.innerHTML=`

<td>${index+1}</td>
<td>${sv.name}</td>
<td>${sv.score}</td>
<td>${getRank(sv.score)}</td>
<td>
<button data-index="${realIndex}">Xóa</button>
</td>

`

tbody.appendChild(tr)

})

updateStats()

}

function updateStats(){

const total=students.length

let avg=0

if(total>0){

const sum=students.reduce(
(a,b)=>a+b.score,0)

avg=(sum/total).toFixed(2)

}

document.getElementById("stats")
.innerText=`Tổng SV: ${total} | Điểm TB: ${avg}`

}

function addStudent(){

const nameInput=document.getElementById("name")
const scoreInput=document.getElementById("score")

const name=nameInput.value.trim()
const score=parseFloat(scoreInput.value)

if(name===""){
alert("Họ tên không được trống")
return
}

if(isNaN(score)||score<0||score>10){
alert("Điểm phải từ 0-10")
return
}

students.push({
name:name,
score:score
})

nameInput.value=""
scoreInput.value=""

nameInput.focus()

applyFilters()

}

document
.getElementById("addBtn")
.addEventListener("click",addStudent)

document
.getElementById("score")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){
addStudent()
}

})

document
.getElementById("search")
.addEventListener("input",applyFilters)

document
.getElementById("filter")
.addEventListener("change",applyFilters)

document
.getElementById("sortScore")
.addEventListener("click",()=>{

sortAsc=!sortAsc

document.getElementById("sortScore")
.innerText=sortAsc
? "Điểm ▲"
: "Điểm ▼"

applyFilters()

})

document
.getElementById("tableBody")
.addEventListener("click",e=>{

if(e.target.tagName==="BUTTON"){

const index=e.target.dataset.index

students.splice(index,1)

applyFilters()

}

})

applyFilters()

</script>

</body>
</html>
