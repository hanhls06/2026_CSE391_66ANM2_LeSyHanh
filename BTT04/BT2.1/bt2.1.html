<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Form đăng ký</title>

<style>

body{
font-family: Arial;
margin:40px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
}

input{
padding:6px;
width:250px;
}

.error{
color:red;
font-size:13px;
}

.success{
font-size:20px;
color:green;
font-weight:bold;
}

</style>

</head>
<body>

<h2>Form đăng ký</h2>

<form id="registerForm">

<div class="form-group">
<label>Họ và tên</label>
<input id="fullname">
<div class="error" id="fullnameError"></div>
</div>

<div class="form-group">
<label>Email</label>
<input id="email">
<div class="error" id="emailError"></div>
</div>

<div class="form-group">
<label>Số điện thoại</label>
<input id="phone">
<div class="error" id="phoneError"></div>
</div>

<div class="form-group">
<label>Mật khẩu</label>
<input type="password" id="password">
<div class="error" id="passwordError"></div>
</div>

<div class="form-group">
<label>Xác nhận mật khẩu</label>
<input type="password" id="confirmPassword">
<div class="error" id="confirmPasswordError"></div>
</div>

<div class="form-group">

<label>Giới tính</label>

<input type="radio" name="gender" value="Nam"> Nam
<input type="radio" name="gender" value="Nữ"> Nữ

<div class="error" id="genderError"></div>

</div>

<div class="form-group">

<label>
<input type="checkbox" id="terms">
Tôi đồng ý điều khoản
</label>

<div class="error" id="termsError"></div>

</div>

<button type="submit">Đăng ký</button>

</form>

<div id="successMessage"></div>

<script>

function showError(id,message){

document.getElementById(id+"Error").innerText=message

}

function clearError(id){

document.getElementById(id+"Error").innerText=""

}

function validateFullname(){

const value=document.getElementById("fullname").value.trim()

const regex=/^[A-Za-zÀ-ỹ\s]{3,}$/

if(value===""){

showError("fullname","Không được để trống")
return false

}

if(!regex.test(value)){

showError("fullname","Tên phải ≥3 ký tự và chỉ chứa chữ")
return false

}

clearError("fullname")
return true

}

function validateEmail(){

const value=document.getElementById("email").value.trim()

const regex=/^\S+@\S+\.\S+$/

if(value===""){

showError("email","Email không được trống")
return false

}

if(!regex.test(value)){

showError("email","Email không đúng định dạng")
return false

}

clearError("email")
return true

}

function validatePhone(){

const value=document.getElementById("phone").value.trim()

const regex=/^0\d{9}$/

if(value===""){

showError("phone","SĐT không được trống")
return false

}

if(!regex.test(value)){

showError("phone","SĐT phải 10 số và bắt đầu bằng 0")
return false

}

clearError("phone")
return true

}

function validatePassword(){

const value=document.getElementById("password").value

const regex=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/

if(value===""){

showError("password","Mật khẩu không được trống")
return false

}

if(!regex.test(value)){

showError("password","≥8 ký tự gồm hoa, thường, số")
return false

}

clearError("password")
return true

}

function validateConfirmPassword(){

const pass=document.getElementById("password").value
const confirm=document.getElementById("confirmPassword").value

if(confirm!==pass){

showError("confirmPassword","Mật khẩu không khớp")
return false

}

clearError("confirmPassword")
return true

}

function validateGender(){

const gender=document.querySelector('input[name="gender"]:checked')

if(!gender){

showError("gender","Vui lòng chọn giới tính")
return false

}

clearError("gender")
return true

}

function validateTerms(){

const checked=document.getElementById("terms").checked

if(!checked){

showError("terms","Bạn phải đồng ý điều khoản")
return false

}

clearError("terms")
return true

}

document.getElementById("registerForm")
.addEventListener("submit",function(e){

e.preventDefault()

const valid=
validateFullname() &
validateEmail() &
validatePhone() &
validatePassword() &
validateConfirmPassword() &
validateGender() &
validateTerms()

if(valid){

const name=document.getElementById("fullname").value

document.getElementById("registerForm").style.display="none"

document.getElementById("successMessage")
.innerHTML=`<div class="success">Đăng ký thành công! 🎉<br>Chào ${name}</div>`

}

})


document.getElementById("fullname").addEventListener("blur",validateFullname)
document.getElementById("email").addEventListener("blur",validateEmail)
document.getElementById("phone").addEventListener("blur",validatePhone)
document.getElementById("password").addEventListener("blur",validatePassword)
document.getElementById("confirmPassword").addEventListener("blur",validateConfirmPassword)

document.getElementById("fullname").addEventListener("input",()=>clearError("fullname"))
document.getElementById("email").addEventListener("input",()=>clearError("email"))
document.getElementById("phone").addEventListener("input",()=>clearError("phone"))
document.getElementById("password").addEventListener("input",()=>clearError("password"))
document.getElementById("confirmPassword").addEventListener("input",()=>clearError("confirmPassword"))

</script>

</body>
</html>
