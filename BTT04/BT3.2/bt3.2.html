<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Multi Step Form</title>

<style>

body{
font-family: Arial;
margin:40px;
}

.progress-container{
width:300px;
height:10px;
background:#ddd;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:33%;
background:green;
}

.step{
display:none;
}

.step.active{
display:block;
}

input,select{
padding:8px;
width:250px;
margin-bottom:10px;
}

button{
padding:8px 15px;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Form Đăng Ký Nhiều Bước</h2>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="stepText">
Bước 1 / 3
</div>

<form id="form">

<!-- STEP 1 -->

<div class="step active">

<h3>Bước 1 – Thông tin cá nhân</h3>

<label>Họ tên</label><br>
<input id="name"><br>

<label>Ngày sinh</label><br>
<input type="date" id="birth"><br>

<label>Giới tính</label><br>
<select id="gender">

<option value="">Chọn giới tính</option>
<option>Nam</option>
<option>Nữ</option>

</select>

<br>

<button type="button" onclick="nextStep()">
Tiếp theo
</button>

</div>


<!-- STEP 2 -->

<div class="step">

<h3>Bước 2 – Thông tin tài khoản</h3>

<label>Email</label><br>
<input id="email"><br>

<label>Mật khẩu</label><br>
<input type="password" id="password"><br>

<label>Xác nhận mật khẩu</label><br>
<input type="password" id="confirm"><br>

<button type="button" onclick="prevStep()">
Quay lại
</button>

<button type="button" onclick="nextStep()">
Tiếp theo
</button>

</div>


<!-- STEP 3 -->

<div class="step">

<h3>Bước 3 – Xác nhận thông tin</h3>

<div id="summary"></div>

<br>

<button type="button" onclick="prevStep()">
Quay lại
</button>

<button type="submit">
Xác nhận
</button>

</div>

</form>


<script>

let currentStep = 0

const steps = document.querySelectorAll(".step")

const progressBar = document.getElementById("progressBar")

const stepText = document.getElementById("stepText")


function showStep(){

steps.forEach(step => step.classList.remove("active"))

steps[currentStep].classList.add("active")

stepText.innerText = "Bước " + (currentStep+1) + " / 3"

progressBar.style.width = ((currentStep+1)/3*100) + "%"


if(currentStep === 2){

document.getElementById("summary").innerHTML =

`
<b>Họ tên:</b> ${document.getElementById("name").value}<br>
<b>Ngày sinh:</b> ${document.getElementById("birth").value}<br>
<b>Giới tính:</b> ${document.getElementById("gender").value}<br>
<b>Email:</b> ${document.getElementById("email").value}
`

}

}


function validateStep(){

if(currentStep === 0){

let name = document.getElementById("name").value
let birth = document.getElementById("birth").value
let gender = document.getElementById("gender").value

if(!name || !birth || !gender){

alert("Vui lòng nhập đầy đủ thông tin cá nhân")

return false

}

}

if(currentStep === 1){

let email = document.getElementById("email").value
let password = document.getElementById("password").value
let confirm = document.getElementById("confirm").value

if(!email){

alert("Email không được để trống")
return false

}

if(password.length < 6){

alert("Mật khẩu phải ≥ 6 ký tự")
return false

}

if(password !== confirm){

alert("Mật khẩu xác nhận không khớp")
return false

}

}

return true

}


function nextStep(){

if(!validateStep()) return

currentStep++

showStep()

}


function prevStep(){

currentStep--

showStep()

}


</script>

</body>

</html>
