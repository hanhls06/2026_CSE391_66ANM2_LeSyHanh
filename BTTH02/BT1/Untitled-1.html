<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập Flexbox Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            padding: 30px;
        }

        .wrapper {
            background: #fff;
            border: 1px solid #333;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row input {
            flex: 1;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            min-height: 220px;
            resize: none;
        }

        .bottom {
            align-items: center;
        }

        button {
            background: #6ec1f5;
            border: 1px solid #5aaee3;
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5aaee3;
        }

        .note {
            margin-left: auto;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h3>Get in touch with us by filling contact form below</h3>

    <form class="contact-form">
        <div class="row">
            <input type="text" placeholder="* Enter your full name">
            <input type="email" placeholder="* Enter your email address">
        </div>

        <input type="text" placeholder="Enter your subject">

        <textarea placeholder="* Your message here..."></textarea>

        <div class="row bottom">
            <button type="submit">Send message</button>
            <span class="note">* Please fill all required form field, thanks!</span>
        </div>
    </form>
</div>

</body>
</html>
