<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Travel Goals</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== HEADER ===== */
header{
  background:#5fd3c4;
  padding:14px 30px;
  border-bottom:4px solid #ff4fa3;
}

nav{
  display:flex;
  justify-content:space-between;
  color:#fff;
  font-weight:bold;
  font-size:14px;
}

/* ===== HERO ===== */
.hero{
  height:420px;
  background:url("images/places/ocean.jpg") center/cover no-repeat;
  position:relative;
  border-bottom:4px solid #ff4fa3;
}

.hero-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.65);
  padding:28px 45px;
  text-align:center;
  color:#fff;
}

.hero-box h1{
  font-size:18px;
  margin-bottom:8px;
}

.hero-box p{
  font-size:11px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.hero-box button{
  background:#f1d400;
  border:none;
  padding:6px 14px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== MAIN ===== */
main{
  background:#e7fbff;
  padding:30px 0 40px;
}

main h2{
  text-align:center;
  font-size:16px;
  margin-bottom:25px;
}

/* ===== HIGHLIGHTS ===== */
.highlights{
  display:flex;
  justify-content:center;
  gap:20px;
}

.card{
  width:260px;
  background:#fff;
  border:1px solid #ccc;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card p{
  text-align:center;
  padding:10px 0;
  font-size:12px;
}

/* ===== FOOTER ===== */
footer{
  background:#111;
  padding:20px 0;
  text-align:center;
}

footer img{
  width:28px;
  margin:0 12px;
}
</style>
</head>

<body>

<header>
  <nav>
    <div>TRAVEL GOALS</div>
    <div>DESTINATIONS</div>
  </nav>
</header>

<section class="hero">
  <div class="hero-box">
    <h1>JOE'S TRAVEL PAGE</h1>
    <p>LET'S EXPLORE THE WORLD TOGETHER</p>
    <button>Discover places</button>
  </div>
</section>

<main>
  <h2>HIGHLIGHTS</h2>

  <div class="highlights">
    <div class="card">
      <img src="images/places/miami.jpg" alt="Miami">
      <p>MIAMI USA</p>
    </div>

    <div class="card">
      <img src="images/places/munich.jpg" alt="Munich">
      <p>MUNICH GERMANY</p>
    </div>

    <div class="card">
      <img src="images/places/barcelona.jpg" alt="Barcelona">
      <p>BARCELONA SPAIN</p>
    </div>
  </div>
</main>

<footer>
  <img src="images/icons/instagram.png" alt="Instagram">
  <img src="images/icons/facebook.png" alt="Facebook">
</footer>

</body>
</html>
